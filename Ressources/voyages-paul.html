<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les voyages de Paul — carte animée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    /* ── Charte J33 ── */
    --noir:#0C111C;
    --creme:#F3EFE4;
    --or:#B5973C;
    --or-clair:#E8D48A;

    --panel:#0C111C;
    --sea-deep:#0A0E17;
    --sea:#16202E;
    --land:#474337;
    --land-edge:#877B5A;
    --ink:#F3EFE4;
    --muted:rgba(243,239,228,.5);
    --rule:rgba(243,239,228,.13);

    /* couleurs des voyages — dérivées de la palette du site */
    --v1:#B5973C;
    --v2:#7FA99B;
    --v3:#E8D48A;
    --v4:#A98BAE;
    --v5:#9FB4C4;
    --cur:var(--v1);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--panel);
    color:var(--ink);
    font-family:'Archivo',"Helvetica Neue",Arial,sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::selection{background:var(--or);color:#fff;}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
  button:focus-visible,input:focus-visible{outline:2px solid var(--or);outline-offset:2px;}

  .app{display:flex;flex-direction:column;height:100%;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:26px;
    padding:14px 20px 12px;
    border-bottom:1px solid var(--rule);
    background:var(--noir);
    flex:0 0 auto;
  }
  .wordmark h1{
    font-family:'Anton',sans-serif;font-weight:400;
    font-size:clamp(16px,2.2vw,24px);letter-spacing:.05em;text-transform:uppercase;
    margin:0;line-height:1;white-space:nowrap;
  }
  .wordmark p{
    margin:7px 0 0;font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);white-space:nowrap;
  }
  /* intégré dans le site : le titre est déjà dans la barre de la visionneuse */
  body.embarque .wordmark h1{display:none;}
  body.embarque .wordmark p{margin:0;}

  .chipbar{position:relative;margin-left:auto;min-width:0;}
  .chipbar::after,.chipbar::before{
    content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none;
    opacity:0;transition:opacity .2s;z-index:1;
  }
  .chipbar::after{right:0;background:linear-gradient(90deg,rgba(12,17,28,0),var(--noir) 70%);}
  .chipbar::before{left:0;background:linear-gradient(270deg,rgba(12,17,28,0),var(--noir) 70%);}
  .chipbar.more::after{opacity:1;}
  .chipbar.less::before{opacity:1;}
  .chips{
    display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;overflow-y:hidden;
    padding-bottom:7px;scrollbar-width:thin;scrollbar-color:rgba(243,239,228,.25) transparent;
    scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{height:4px;}
  .chips::-webkit-scrollbar-thumb{background:rgba(243,239,228,.25);border-radius:3px;}
  .chips::-webkit-scrollbar-track{background:transparent;}
  .chip{
    flex:0 0 auto;display:flex;flex-direction:column;gap:4px;align-items:flex-start;
    padding:8px 13px 9px;border:1px solid var(--rule);
    white-space:nowrap;transition:background .2s,border-color .2s;
  }
  @media(hover:hover){.chip:hover{background:rgba(243,239,228,.05);border-color:rgba(243,239,228,.3);}}
  .chip .nm{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;}
  .chip .yr{font-size:10px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  .chip[aria-pressed="true"]{background:rgba(181,151,60,.10);border-color:currentColor;}
  .chip[aria-pressed="true"] .nm{color:currentColor;}
  .chip .dot{width:24px;height:2px;background:currentColor;display:block;margin-bottom:2px;opacity:.5;}
  .chip[aria-pressed="true"] .dot{opacity:1;}

  /* ---------- main ---------- */
  .main{display:flex;flex:1 1 auto;min-height:0;}
  .stage{position:relative;flex:1 1 auto;min-width:0;background:var(--sea-deep);overflow:hidden;}
  svg#map{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab;}
  svg#map.dragging{cursor:grabbing;}

  .land{fill:var(--land);stroke:var(--land-edge);stroke-width:.6;stroke-linejoin:round;}
  .coasthalo{fill:none;stroke:#E8D48A;opacity:.13;stroke-linejoin:round;}
  .rhumb{stroke:#DCEAF3;stroke-width:.5;opacity:.06;fill:none;}
  .route{fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .maskline{fill:none;stroke:#fff;stroke-linecap:butt;}
  .city{fill:var(--sea-deep);stroke:var(--ink);stroke-width:1.6;}
  .city.key{stroke-width:2.2;}
  .lbl{
    font-family:'Archivo',sans-serif;font-weight:500;
    fill:var(--ink);paint-order:stroke;stroke:#0A0E17;stroke-width:3.4;
    stroke-linejoin:round;letter-spacing:.05em;
  }
  .lbl.key{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.1em;}
  .storm{
    font-family:'Archivo',sans-serif;font-style:italic;font-weight:300;
    letter-spacing:.02em;paint-order:stroke;stroke:#0A0E17;stroke-linejoin:round;
  }
  .ep{fill:none;stroke:var(--or-clair);stroke-opacity:.5;stroke-linecap:round;}
  .ephead{fill:var(--or-clair);fill-opacity:.6;}
  .epdest{fill:none;stroke:var(--or-clair);stroke-opacity:.7;}
  .eplbl{
    font-family:'Archivo',sans-serif;font-style:italic;fill:#F4E8CB;
    text-anchor:middle;paint-order:stroke;stroke:#0A0E17;stroke-linejoin:round;
  }
  .fade{opacity:0;transition:opacity .5s ease;}
  .fade.on{opacity:1;}

  /* ---------- transport ---------- */
  .transport{
    position:absolute;left:16px;right:16px;bottom:14px;
    display:flex;align-items:center;gap:14px;
    padding:9px 16px;border:1px solid var(--rule);border-radius:44px;
    background:rgba(12,17,28,.86);backdrop-filter:blur(6px);
  }
  .icon{
    width:34px;height:34px;display:grid;place-items:center;
    border:1px solid var(--rule);border-radius:50%;flex:0 0 auto;
    transition:border-color .2s,background .2s;
  }
  @media(hover:hover){.icon:hover{border-color:var(--or);background:var(--or);}}
  .icon svg{width:13px;height:13px;fill:var(--ink);transition:fill .2s;}
  @media(hover:hover){.icon:hover svg{fill:#fff;}}
  input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1 1 auto;height:18px;background:none;min-width:60px;
  }
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:rgba(243,239,228,.2);border-radius:2px;}
  input[type=range]::-moz-range-track{height:3px;background:rgba(243,239,228,.2);border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;
    background:var(--cur);margin-top:-5px;border:none;box-shadow:0 1px 6px rgba(0,0,0,.5);
  }
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:none;border-radius:50%;background:var(--cur);}
  .speed{
    font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    padding:7px 13px;border:1px solid var(--rule);border-radius:40px;flex:0 0 auto;transition:color .2s,border-color .2s;
  }
  @media(hover:hover){.speed:hover{color:var(--or);border-color:var(--or);}}

  .legend{
    position:absolute;left:18px;top:16px;
    font-size:10px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    display:flex;flex-direction:column;gap:6px;pointer-events:none;
  }
  .legend span{display:flex;align-items:center;gap:8px;}
  .legend i{width:26px;height:0;border-top:2px solid var(--cur);display:block;}
  .legend i.dash{border-top-style:dotted;border-top-width:2px;opacity:.75;}
  .legend i.ink{border-top:1px dashed var(--or-clair);opacity:.65;}

  /* ---------- panel ---------- */
  .panel{
    flex:0 0 360px;display:flex;flex-direction:column;min-height:0;
    border-left:1px solid var(--rule);background:var(--panel);
  }
  .now{padding:20px 22px 18px;border-bottom:1px solid var(--rule);}
  .now .eyebrow{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--cur);}
  .now h2{
    font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(20px,2.6vw,28px);
    margin:10px 0 0;line-height:1.08;letter-spacing:.02em;text-transform:uppercase;
  }
  .now .ref{margin-top:8px;font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  .now .wrote{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--rule);}
  .wh{display:block;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--or);}
  .wl{
    display:block;margin-top:7px;color:#EFE0BB;
    font-style:italic;font-weight:400;font-size:14px;line-height:1.55;
  }
  .wn{
    display:block;margin-top:5px;color:rgba(243,239,228,.6);font-size:12.5px;line-height:1.6;
    font-weight:300;letter-spacing:.01em;
  }
  .now .wrote:empty{display:none;}
  .now .note{
    font-weight:300;font-size:14px;line-height:1.7;
    margin:14px 0 0;color:rgba(243,239,228,.78);min-height:3.4em;
  }
  .caveat{
    margin:6px 22px 12px;padding:10px 14px;border-left:2px solid var(--cur);
    background:rgba(243,239,228,.04);color:rgba(243,239,228,.6);
    font-size:12.5px;line-height:1.6;font-style:italic;font-weight:300;
  }
  .logwrap{
    position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;padding:6px 0 14px;
    scrollbar-width:thin;scrollbar-color:rgba(243,239,228,.2) transparent;overscroll-behavior:contain;
  }
  .logwrap::-webkit-scrollbar{width:5px;}
  .logwrap::-webkit-scrollbar-thumb{background:rgba(243,239,228,.2);border-radius:3px;}
  .stop{
    display:grid;grid-template-columns:32px 1fr auto;align-items:baseline;gap:10px;
    width:100%;text-align:left;padding:9px 22px;opacity:.34;
    transition:opacity .3s,background .15s,padding-left .25s;
  }
  @media(hover:hover){.stop:hover{background:rgba(243,239,228,.05);opacity:.8;padding-left:27px;}}
  .stop.done{opacity:1;}
  .stop.here{background:rgba(181,151,60,.10);opacity:1;}
  .stop .idx{font-family:'Anton',sans-serif;font-size:13px;letter-spacing:.06em;color:rgba(243,239,228,.3);font-variant-numeric:tabular-nums;}
  .stop.done .idx,.stop.here .idx{color:var(--cur);}
  .stop .nm{font-size:15px;font-weight:400;letter-spacing:.02em;}
  .stop.here .nm{font-weight:600;}
  .stop .rf{font-size:10px;font-weight:500;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;}
  .stop .epn{
    display:block;font-style:italic;font-weight:300;
    font-size:12.5px;letter-spacing:0;color:var(--or-clair);opacity:.8;margin-top:2px;
  }
  .stop .nm::before{
    content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--cur);margin-right:9px;vertical-align:middle;opacity:0;
  }
  .stop.here .nm::before{opacity:1;}
  .foot{
    padding:13px 22px;border-top:1px solid var(--rule);
    font-size:10px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    display:flex;justify-content:space-between;gap:10px;
  }

  @media (max-width:1280px){
    .topbar{flex-direction:column;align-items:stretch;gap:11px;}
    .chipbar{margin-left:0;}
  }
  @media (max-width:860px){
    body{overflow:auto;}
    .app{height:auto;min-height:100%;}
    .topbar{flex-direction:column;align-items:stretch;gap:10px;padding:12px 16px 10px;}
    .wordmark p{white-space:normal;letter-spacing:.12em;font-size:10px;line-height:1.45;}
    .main{flex-direction:column;}
    .stage{flex:0 0 auto;height:56vh;min-height:300px;}
    .panel{flex:1 1 auto;border-left:none;border-top:1px solid var(--rule);}
    .logwrap{max-height:none;overflow:visible;}
    .now{padding:15px 16px 14px;}
    .now .note{font-size:13.5px;min-height:0;}
    .caveat{margin:6px 16px 12px;}
    .stop{padding:8px 16px;}
    @media(hover:hover){.stop:hover{padding-left:21px;}}
    .foot{padding:12px 16px;}
    .transport{left:10px;right:10px;bottom:10px;gap:10px;padding:7px 12px;}
    .legend{font-size:9.5px;gap:5px;left:14px;top:14px;}
  }
  @media (prefers-reduced-motion:reduce){
    .fade{transition:none;}
  }
</style>
</head>
<body>
<script>if(window.self!==window.top)document.body.classList.add("embarque");</script>
<div class="app">
  <header class="topbar">
    <div class="wordmark">
      <h1>Les voyages de Paul</h1>
      <p>D'après les Actes des Apôtres et les épîtres · env. 46–67 apr. J.-C.</p>
    </div>
    <div class="chipbar" id="chipbar">
      <nav class="chips" id="chips" aria-label="Choisir un voyage"></nav>
    </div>
  </header>

  <div class="main">
    <div class="stage">
      <svg id="map" role="img" aria-label="Carte de la Méditerranée orientale et des itinéraires de Paul"></svg>
      <div class="legend">
        <span><i></i> par mer</span>
        <span><i class="dash"></i> par voie de terre</span>
        <span><i class="ink"></i> envoi d'une lettre</span>
      </div>
      <div class="transport">
        <button class="icon" id="prev" aria-label="Étape précédente">
          <svg viewBox="0 0 16 16"><path d="M3 2h1.9v12H3zM14 2v12L5.6 8z"/></svg>
        </button>
        <button class="icon" id="play" aria-label="Lancer le trajet"></button>
        <button class="icon" id="next" aria-label="Étape suivante">
          <svg viewBox="0 0 16 16"><path d="M11.1 2H13v12h-1.9zM2 2l8.4 6L2 14z"/></svg>
        </button>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Avancer dans le trajet">
        <button class="speed" id="speed" aria-label="Changer la vitesse">1×</button>
        <button class="icon" id="fit" aria-label="Recadrer la carte">
          <svg viewBox="0 0 16 16"><path d="M1 1h5v1.6H2.6V6H1V1zm9 0h5v5h-1.6V2.6H10V1zM1 10h1.6v3.4H6V15H1v-5zm12.4 0H15v5h-5v-1.6h3.4V10z"/></svg>
        </button>
      </div>
    </div>

    <aside class="panel">
      <div class="now">
        <div class="eyebrow" id="nowEyebrow">Étape 1</div>
        <h2 id="nowName">—</h2>
        <div class="ref" id="nowRef"></div>
        <p class="note" id="nowNote"></p>
        <p class="wrote" id="nowWrote"></p>
      </div>
      <div class="logwrap" id="logwrap"></div>
      <div class="foot"><span id="footLeft"></span><span id="footRight"></span></div>
    </aside>
  </div>
</div>

/* courbe douce passant par une suite de points (Catmull-Rom) */
function spline(P){
  if (P.length < 3) return `M${P[0][0]},${P[0][1]} L${P[P.length-1][0]},${P[P.length-1][1]}`;
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i = 0; i < P.length - 1; i++){
    const p0 = P[i-1] || P[i], p1 = P[i], p2 = P[i+1], p3 = P[i+2] || P[i+1];
    const c1x = p1[0] + (p2[0]-p0[0])/6, c1y = p1[1] + (p2[1]-p0[1])/6;
    const c2x = p2[0] - (p3[0]-p1[0])/6, c2y = p2[1] - (p3[1]-p1[1])/6;
    d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}

/* trajet de tempête : une houle par nuit de dérive (Ac 27,27) */
const JIT = [.20,-.46,.58,-.28,.66,-.52,.30,-.72,.50,-.24,.60,-.40,.18,0];
function driftPts(x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1, L = Math.hypot(dx,dy) || 1;
  const nx = dy/L, ny = -dx/L;            // perpendiculaire, vers le sud
  const N = JIT.length, bow = .085, amp = .075;
  const P = [[x1, y1]];
  for (let i = 1; i <= N; i++){
    const u = i/N, env = Math.sin(Math.PI*u);
    const o = (bow + JIT[i-1]*amp) * L * env;
    P.push([+(x1 + dx*u + nx*o).toFixed(1), +(y1 + dy*u + ny*o).toFixed(1)]);
  }
  return P;
}

const OFF = {n:[0,-1], s:[0,1], e:[1,0], w:[-1,0],
             ne:[.78,-.72], nw:[-.78,-.72], se:[.78,.72], sw:[-.78,.72]};

function clear(g){ while (g.firstChild) g.removeChild(g.firstChild); }

function buildJourney(idx){
  J = JOURNEYS[idx];
  document.documentElement.style.setProperty('--cur', J.hex);
  clear(gRoute); clear(gEp); clear(gCity); clear(gHead);
  defs.querySelectorAll('mask').forEach(m => m.remove());

  const pts = J.stops.map(s => proj(s.lon, s.lat));

  /* --- géométrie : un aller-retour emprunte la même route, légèrement décalée --- */
  const geo = [], seenPair = new Map();
  for (let i = 0; i < pts.length - 1; i++){
    const a = J.stops[i].n, b = J.stops[i+1].n;
    const key = a < b ? a + '|' + b : b + '|' + a;
    const g = seenPair.get(key) || {n:0, base:null, fwd:a < b};
    g.n++; seenPair.set(key, g);
    geo.push({key, rank:g.n - 1, fwd:a < b});
  }
  const bbJ = bboxOfJourney();
  const gap = Math.max(4.5, .016 * Math.max(bbJ.x1-bbJ.x0, bbJ.y1-bbJ.y0));
  function densify(P, min){
    if (P.length >= min) return P;
    const n = Math.ceil((min - 1) / (P.length - 1)), out = [P[0]];
    for (let j = 1; j < P.length; j++)
      for (let q = 1; q <= n; q++)
        out.push([P[j-1][0] + (P[j][0]-P[j-1][0])*q/n, P[j-1][1] + (P[j][1]-P[j-1][1])*q/n]);
    return out;
  }
  /* décalage nul aux deux extrémités : les tracés se rejoignent exactement sur la ville */
  function offsetPts(P, d){
    if (!d) return P;
    const cum = [0];
    for (let j = 1; j < P.length; j++)
      cum.push(cum[j-1] + Math.hypot(P[j][0]-P[j-1][0], P[j][1]-P[j-1][1]));
    const T = cum[cum.length-1] || 1, out = [];
    for (let j = 0; j < P.length; j++){
      const p0 = P[Math.max(0, j-1)], p1 = P[Math.min(P.length-1, j+1)];
      const vx = p1[0]-p0[0], vy = p1[1]-p0[1], L = Math.hypot(vx, vy) || 1;
      const env = Math.sin(Math.PI * cum[j] / T);
      out.push([+(P[j][0] + vy/L*d*env).toFixed(1), +(P[j][1] - vx/L*d*env).toFixed(1)]);
    }
    return out;
  }

  /* --- tracés, un par étape --- */
  legs = [];
  for (let i = 0; i < pts.length - 1; i++){
    const [x1,y1] = pts[i], [x2,y2] = pts[i+1];
    const sea = J.stops[i+1].mode === 'mer';
    const dx = x2-x1, dy = y2-y1, L = Math.hypot(dx,dy) || 1;
    const drift = J.stops[i+1].drift;
    const gi = geo[i], grp = seenPair.get(gi.key);
    let wp = (ROUTES[J.id] || {})[i];
    if (grp.n > 1 && !drift){
      if (!grp.base) grp.base = wp && wp.length > 1 ? (gi.fwd ? wp : wp.slice().reverse())
                                                   : [[x1,y1],[x2,y2]].map((q,qi) => gi.fwd ? q : [x2,y2][qi]);
      if (!grp.base) grp.base = [[x1,y1],[x2,y2]];
      let base = densify(grp.base.slice(), 7);
      if (!gi.fwd) base = base.slice().reverse();
      const d = (gi.rank - (grp.n - 1) / 2) * gap * (gi.fwd ? 1 : -1);
      wp = offsetPts(base, d);
    }
    let d, bpts;
    if (drift){
      bpts = driftPts(x1, y1, x2, y2); d = spline(bpts);
    } else if (wp && wp.length > 2){
      bpts = wp; d = spline(wp);
    } else if (sea){
      const c = 0.075, cx = (x1+x2)/2 + dy*c, cy = (y1+y2)/2 - dx*c;
      bpts = [[x1,y1],[cx,cy],[x2,y2]];
      d = `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`;
    } else {
      bpts = [[x1,y1],[x2,y2]];
      d = `M${x1},${y1} L${x2},${y2}`;
    }
    const bx0 = Math.min(...bpts.map(p=>p[0])), bx1 = Math.max(...bpts.map(p=>p[0]));
    const by0 = Math.min(...bpts.map(p=>p[1])), by1 = Math.max(...bpts.map(p=>p[1]));
    const mid = 'm' + J.id + i;
    const mask = el('mask', {id:mid, maskUnits:'userSpaceOnUse',
                             x:bx0-140, y:by0-140,
                             width:(bx1-bx0)+280, height:(by1-by0)+280});
    const mline = el('path', {d, class:'maskline'});
    mask.appendChild(mline); defs.appendChild(mask);

    const p = el('path', {d, class:'route', stroke:J.hex, mask:`url(#${mid})`,
                          'vector-effect':'non-scaling-stroke'});
    p.dataset.sea = sea ? '1' : '0';
    gRoute.appendChild(p);

    const len = mline.getTotalLength();
    const leg = {p, mline, len, path:mline, cap:null};
    if (drift){
      const mid = mline.getPointAtLength(len * .52);
      const cap = el('text', {x:mid.x, y:mid.y, class:'storm fade', 'text-anchor':'middle', fill:J.hex});
      cap.textContent = drift;
      gRoute.appendChild(cap);
      leg.cap = cap; leg.capY = mid.y; leg.capX = mid.x;
    }
    legs.push(leg);
  }

  /* poids temps : moitié distance, moitié durée fixe par étape */
  const totalLen = legs.reduce((a,l) => a + l.len, 0) || 1;
  legs.forEach(l => { l.tw = .5 * (l.len / totalLen) + .5 * (1 / legs.length); });
  const sumTw = legs.reduce((a,l) => a + l.tw, 0) || 1;
  let acc = 0;
  legs.forEach(l => { l.tw /= sumTw; l.t0 = acc; acc += l.tw; });
  if (legs.length) legs[legs.length-1].tw = 1 - legs[legs.length-1].t0;

  /* --- villes (dédoublonnées) --- */
  nodes = [];
  const seen = new Map();
  J.stops.forEach((s, i) => {
    if (seen.has(s.n)){ nodes.push(seen.get(s.n)); return; }
    const [x,y] = pts[i];
    const g = el('g', {class:'fade'});
    const c = el('circle', {cx:x, cy:y, class:'city' + (s.key ? ' key' : ''),
                            'vector-effect':'non-scaling-stroke'});
    const [ox,oy] = OFF[s.dir];
    const tx = el('text', {x:x, y:y, class:'lbl' + (s.key ? ' key' : ''),
                           'text-anchor': ox > .2 ? 'start' : ox < -.2 ? 'end' : 'middle'});
    tx.textContent = s.n;
    g.append(c, tx); gCity.appendChild(g);
    const node = {g, c, tx, x, y, ox, oy, key:s.key};
    seen.set(s.n, node); nodes.push(node);
  });

  /* --- lettres écrites en chemin --- */
  eps = [];
  const bb = bboxOfJourney();
  const reach = .12 * Math.max(bb.x1-bb.x0, bb.y1-bb.y0);
  J.stops.forEach((st, i) => {
    if (!st.letters) return;
    const [ox, oy] = pts[i];
    const nL = st.letters.length;
    st.letters.forEach((L2, li) => {
      let [dx2, dy2] = proj(L2.lon, L2.lat);
      const inside = dx2 > bb.x0 - reach && dx2 < bb.x1 + reach &&
                     dy2 > bb.y0 - reach && dy2 < bb.y1 + reach;
      const vx = dx2 - ox, vy = dy2 - oy, VL = Math.hypot(vx, vy) || 1;
      if (!inside){ dx2 = ox + vx/VL * reach * 1.25; dy2 = oy + vy/VL * reach * 1.25; }
      const g = el('g', {class:'fade'});
      const mx = (ox+dx2)/2, my = (oy+dy2)/2;
      const L3 = Math.hypot(dx2-ox, dy2-oy) || 1;
      const cx = mx + (dy2-oy)/L3 * L3 * .17, cy = my - (dx2-ox)/L3 * L3 * .17;
      const p = el('path', {class:'ep', 'vector-effect':'non-scaling-stroke',
                            d:`M${ox.toFixed(1)},${oy.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${dx2.toFixed(1)},${dy2.toFixed(1)}`});
      const uu = nL > 1 ? .34 + .32 * li / (nL - 1) : .5;
      const qx = (1-uu)*(1-uu)*ox + 2*(1-uu)*uu*cx + uu*uu*dx2;
      const qy = (1-uu)*(1-uu)*oy + 2*(1-uu)*uu*cy + uu*uu*dy2;
      const headP = el('polygon', {class:'ephead'});
      const lab = el('text', {class:'eplbl'});
      lab.textContent = L2.titre + (inside ? '' : ' → ' + L2.to);
      g.append(p, headP, lab);
      let dot = null, dlab = null;
      const near = nodes.some(n => Math.hypot(n.x - dx2, n.y - dy2) < 16);
      if (inside && !seen.has(L2.to) && !near){
        dot = el('circle', {cx:dx2, cy:dy2, class:'epdest', 'vector-effect':'non-scaling-stroke'});
        dlab = el('text', {x:dx2, y:dy2, class:'lbl', 'text-anchor':'middle'});
        dlab.textContent = L2.to;
        g.append(dot, dlab);
      }
      gEp.appendChild(g);
      const ang = Math.atan2(dy2-cy, dx2-cx);
      eps.push({g, headP, lab, dot, dlab, i, ex:dx2, ey:dy2, ang, lx:qx, ly:qy});
    });
  });

  headRing = el('circle', {cx:0, cy:0, fill:'none', stroke:J.hex, 'stroke-width':1.4,
                           'vector-effect':'non-scaling-stroke', opacity:.55});
  head = el('circle', {cx:0, cy:0, fill:'#F3EFE4', stroke:J.hex, 'stroke-width':2,
                       'vector-effect':'non-scaling-stroke', filter:'url(#glow)'});
  gHead.append(headRing, head);

  buildLog();
  fit(true);
  applyScale();
  t = 0; setT(0);
  stopAt = null;
  setPlaying(false);
  sync();
}

/* ---------- échelle constante à l'écran ---------- */
function applyScale(){
  k = vb.w / MAP.w;
  nodes.forEach(n => {
    n.c.setAttribute('r', (n.key ? 5 : 3.6) * k);
    n.tx.setAttribute('font-size', (n.key ? 15 : 13) * k);
    n.tx.setAttribute('x', n.x + n.ox * (n.key ? 11 : 8.5) * k);
    n.tx.setAttribute('y', n.y + n.oy * (n.key ? 12 : 10) * k + (n.oy === 0 ? 4.6*k : (n.oy > 0 ? 5*k : 0)));
    n.tx.setAttribute('stroke-width', 3.4 * k);
  });
  legs.forEach(l => {
    l.p.setAttribute('stroke-width', l.p.dataset.sea === '1' ? 2.6 : 2);
    l.p.setAttribute('stroke-dasharray', l.p.dataset.sea === '1' ? (J.hyp ? '9 5' : 'none') : '0.1 5.5');
    l.p.setAttribute('opacity', l.p.dataset.sea === '1' ? 1 : .9);
    l.mline.setAttribute('stroke-width', 40 * k);
    if (l.cap){
      l.cap.setAttribute('font-size', 13 * k);
      l.cap.setAttribute('y', l.capY + 26 * k);
      l.cap.setAttribute('stroke-width', 3.4 * k);
    }
  });
  if (head){ head.setAttribute('r', 4.4*k); headRing.setAttribute('r', 9*k); }
  eps.forEach(e => {
    const s0 = 7*k, back = 3*k, c = Math.cos(e.ang), si = Math.sin(e.ang);
    const tipx = e.ex - c*back, tipy = e.ey - si*back;
    e.headP.setAttribute('points',
      `${tipx},${tipy} ${tipx - c*s0 + si*s0*.5},${tipy - si*s0 - c*s0*.5} ` +
      `${tipx - c*s0 - si*s0*.5},${tipy - si*s0 + c*s0*.5}`);
    e.g.querySelector('.ep').setAttribute('stroke-width', 1.2);
    e.g.querySelector('.ep').setAttribute('stroke-dasharray', '4 3.5');
    e.lab.setAttribute('x', e.lx); e.lab.setAttribute('y', e.ly - 8*k);
    e.lab.setAttribute('font-size', 12.5*k);
    e.lab.setAttribute('stroke-width', 3.2*k);
    if (e.dot) e.dot.setAttribute('r', 3.2*k);
    if (e.dlab){
      e.dlab.setAttribute('y', e.ey + 15*k);
      e.dlab.setAttribute('font-size', 12.5*k);
      e.dlab.setAttribute('stroke-width', 3.2*k);
    }
  });
}

/* ---------- cadrage ---------- */
function bboxOfJourney(){
  const xs = [], ys = [];
  J.stops.forEach(s => { const [x,y] = proj(s.lon, s.lat); xs.push(x); ys.push(y); });
  return {x0:Math.min(...xs), x1:Math.max(...xs), y0:Math.min(...ys), y1:Math.max(...ys)};
}
function fit(animate){
  const r = svg.getBoundingClientRect(), ar = r.width / Math.max(r.height, 1);
  const b = bboxOfJourney();
  const pad = Math.max(90, 0.17 * Math.max(b.x1-b.x0, b.y1-b.y0));
  let w = (b.x1 - b.x0) + pad*2, h = (b.y1 - b.y0) + pad*2;
  if (w / h < ar) w = h * ar; else h = w / ar;
  const target = {x:(b.x0 + b.x1)/2 - w/2, y:(b.y0 + b.y1)/2 - h/2, w, h};
  if (!animate || reduced){ vb = target; commitVB(); return; }
  const from = {...vb}, t0 = performance.now(), dur = 750;
  cancelAnimationFrame(vbAnim);
  (function step(now){
    const u = Math.min(1, (now - t0) / dur), e = u < .5 ? 4*u*u*u : 1 - Math.pow(-2*u+2, 3)/2;
    vb = {x:from.x + (target.x-from.x)*e, y:from.y + (target.y-from.y)*e,
          w:from.w + (target.w-from.w)*e, h:from.h + (target.h-from.h)*e};
    commitVB();
    if (u < 1) vbAnim = requestAnimationFrame(step);
  })(t0);
}
function commitVB(){
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  applyScale();
}

/* ---------- lecture ---------- */
function setT(v){
  t = Math.max(0, Math.min(1, v));
  let cur = 0;
  legs.forEach((l, i) => {
    const raw = (t - l.t0) / l.tw;                 // marge d'arrondi : sinon la dernière
    const done = raw >= 1 - 1e-6;                  // image d'une étape ne la valide pas
    const u = done ? 1 : Math.max(0, Math.min(1, raw));
    l.mline.setAttribute('stroke-dasharray', `${l.len} ${l.len}`);
    l.mline.setAttribute('stroke-dashoffset', l.len * (1 - u));
    if (done) cur = i + 1;
    if (l.cap) l.cap.classList.toggle('on', u > .12);
    if (u > 0 && !done){
      const pt = l.path.getPointAtLength(l.len * u);
      head.setAttribute('cx', pt.x); head.setAttribute('cy', pt.y);
      headRing.setAttribute('cx', pt.x); headRing.setAttribute('cy', pt.y);
      gHead.style.opacity = 1;
    }
  });
  if (t <= 0 || t >= 1) gHead.style.opacity = 0;
  const shown = new Set();
  for (let i = 0; i <= cur && i < nodes.length; i++) shown.add(nodes[i]);
  nodes.forEach(n => n.g.classList.toggle('on', shown.has(n)));
  eps.forEach(e => e.g.classList.toggle('on', cur >= e.i));
  setCurrent(cur);
}

let lastCur = -1;
function setCurrent(i){
  if (i === lastCur) return;
  lastCur = i;
  const s = J.stops[i];
  $('nowEyebrow').textContent = `Étape ${i+1} / ${J.stops.length} · ${s.mode === 'terre' ? 'par voie de terre' : (s.mode === 'mer' ? 'par mer' : 'point de départ')}`;
  $('nowName').textContent = s.n;
  $('nowRef').textContent = s.ref;
  $('nowNote').textContent = s.note;
  const wbox = $('nowWrote'); wbox.innerHTML = '';
  if (s.letters && s.letters.length){
    const h = document.createElement('span'); h.className = 'wh';
    h.textContent = s.letters.length > 1 ? 'Lettres écrites ici' : 'Lettre écrite ici';
    wbox.appendChild(h);
    s.letters.forEach(l => {
      const a = document.createElement('span'); a.className = 'wl';
      a.textContent = l.titre + ' — ' + l.when + ', pour ' + l.to;
      wbox.appendChild(a);
      if (l.note){
        const b = document.createElement('span'); b.className = 'wn';
        b.textContent = l.note; wbox.appendChild(b);
      }
    });
  }
  document.querySelectorAll('.stop').forEach((r, j) => {
    r.classList.toggle('done', j <= i);
    r.classList.toggle('here', j === i);
  });

}

function buildLog(){
  const w = $('logwrap'); w.innerHTML = '';
  if (J.caveat){
    const c = document.createElement('p'); c.className = 'caveat';
    c.textContent = J.caveat; w.appendChild(c);
  }
  J.stops.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'stop';
    b.innerHTML = `<span class="idx">${String(i+1).padStart(2,'0')}</span>` +
                  `<span class="nm"><span class="t"></span></span><span class="rf"></span>`;
    b.querySelector('.t').textContent = s.n;
    if (s.letters && s.letters.length){
      const e = document.createElement('span');
      e.className = 'epn';
      e.textContent = '✎ ' + s.letters.map(l => l.titre).join(' · ');
      b.querySelector('.nm').appendChild(e);
    }
    b.querySelector('.rf').textContent = s.ref;
    b.addEventListener('click', () => {
      stopAt = null; setPlaying(false);
      setT(bound(i)); sync();
    });
    w.appendChild(b);
  });
  $('footLeft').textContent = J.acts;
  $('footRight').textContent = `${J.stops.length} étapes`;
  lastCur = -1;
}

const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M3.5 2.2 13 8l-9.5 5.8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16"><path d="M3.5 2h3.2v12H3.5zM9.3 2h3.2v12H9.3z"/></svg>';
function setPlaying(v){
  playing = v;
  $('play').innerHTML = v ? ICON_PAUSE : ICON_PLAY;
  $('play').setAttribute('aria-label', v ? 'Mettre en pause' : 'Lancer le trajet');
  if (v){ if (t >= 1) t = 0; lastFrame = performance.now(); requestAnimationFrame(tick); }
}
function tick(now){
  if (!playing) return;
  const dt = Math.max(0, Math.min(60, now - lastFrame)); lastFrame = now;
  let nt = t + (dt * speed) / BASE_MS;
  if (stopAt !== null && nt >= stopAt){ nt = stopAt; stopAt = null; setT(nt); sync(); setPlaying(false); return; }
  setT(nt); sync();
  if (t >= 1) setPlaying(false); else requestAnimationFrame(tick);
}
function sync(){ $('scrub').value = Math.round(t * 1000); }

/* borne temporelle de l'étape i (0 = départ) */
function bound(i){
  if (i <= 0) return 0;
  const l = legs[Math.min(i, legs.length) - 1];
  return l ? Math.min(1, l.t0 + l.tw) : 1;
}
function stepNext(){
  if (playing && stopAt !== null) setT(stopAt);   // termine l'étape en cours
  const i = lastCur;
  if (i >= J.stops.length - 1){ stopAt = null; setPlaying(false); setT(1); sync(); return; }
  stopAt = bound(i + 1);
  if (reduced){ setT(stopAt); stopAt = null; sync(); setPlaying(false); return; }
  setPlaying(true);
}
function stepPrev(){
  stopAt = null; setPlaying(false);
  setT(bound(Math.max(0, lastCur - 1))); sync();
}

/* ---------- contrôles ---------- */
$('play').addEventListener('click', () => { stopAt = null; setPlaying(!playing); });
$('prev').addEventListener('click', stepPrev);
$('next').addEventListener('click', stepNext);
$('scrub').addEventListener('input', e => { stopAt = null; setPlaying(false); setT(e.target.value / 1000); });
$('fit').addEventListener('click', () => fit(true));
const SPEEDS = [0.5, 1, 2, 4];
$('speed').addEventListener('click', () => {
  speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length];
  $('speed').textContent = (speed === 0.5 ? '½' : speed) + '×';
});

/* onglets */
const chips = $('chips');
JOURNEYS.forEach((j, i) => {
  const b = document.createElement('button');
  b.className = 'chip'; b.style.color = j.hex;
  b.innerHTML = `<span class="dot"></span><span class="nm"></span><span class="yr"></span>`;
  b.querySelector('.nm').textContent = j.name;
  b.querySelector('.yr').textContent = j.years;
  b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
  b.addEventListener('click', () => {
    [...chips.children].forEach((c, ci) => c.setAttribute('aria-pressed', ci === i ? 'true' : 'false'));
    revealChip(b);
    stopAt = null; setPlaying(false); $('scrub').value = 0; buildJourney(i);
  });
  chips.appendChild(b);
});

/* barre d'onglets : indicateur « ça continue à droite » */
const chipbar = $('chipbar');
function chipHint(){
  const c = $('chips');
  chipbar.classList.toggle('more', c.scrollWidth - c.clientWidth - c.scrollLeft > 6);
  chipbar.classList.toggle('less', c.scrollLeft > 6);
}
$('chips').addEventListener('scroll', chipHint);
addEventListener('resize', chipHint);
function revealChip(b){
  const c = $('chips'), r = b.getBoundingClientRect(), p = c.getBoundingClientRect();
  if (r.left < p.left + 4) c.scrollLeft += r.left - p.left - 12;
  else if (r.right > p.right - 4) c.scrollLeft += r.right - p.right + 12;
}

/* pan + zoom */
let drag = null;
svg.addEventListener('pointerdown', e => {
  drag = {x:e.clientX, y:e.clientY, vx:vb.x, vy:vb.y};
  svg.setPointerCapture(e.pointerId); svg.classList.add('dragging');
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  const r = svg.getBoundingClientRect();
  vb.x = drag.vx - (e.clientX - drag.x) * vb.w / r.width;
  vb.y = drag.vy - (e.clientY - drag.y) * vb.h / r.height;
  commitVB();
});
const endDrag = () => { drag = null; svg.classList.remove('dragging'); };
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const f = Math.exp(e.deltaY * 0.0012);
  const nw = Math.max(MAP.w*0.06, Math.min(MAP.w*1.6, vb.w * f));
  const s = nw / vb.w;
  const mx = (e.clientX - r.left) / r.width, mo = (e.clientY - r.top) / r.height;
  vb.x += vb.w * mx * (1 - s); vb.y += vb.h * mo * (1 - s);
  vb.w = nw; vb.h *= s;
  commitVB();
}, {passive:false});

addEventListener('resize', () => fit(false));
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' '){ e.preventDefault(); stopAt = null; setPlaying(!playing); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); stepNext(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); stepPrev(); }
});

$('play').innerHTML = ICON_PLAY;
buildJourney(0);
chipHint();
</script>
</body>
</html>
